name: tests

on:
  push:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install dependencies
        run: pip install -r requirements.txt
      - name: End-to-end tests
        run: PYTHONPATH=src python -m pytest -q tests
      - name: Full simulated run and recovery check
        run: PYTHONPATH=src python -m digital_days.run --simulate
      - name: Rebuild figure
        run: PYTHONPATH=src python -m digital_days.figure
      # Manual runs (Actions tab -> Run workflow) commit the rebuilt site data and figure.
      - name: Commit rebuilt site data and figure
        if: github.event_name == 'workflow_dispatch'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs
          git diff --cached --quiet || (git commit -m "Rebuild site data and figure" && git push)
