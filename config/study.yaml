# Digital Days — measurement-burst study design
# Single source of truth for design parameters. Every script reads this file.

study:
  name: "Digital Days"
  project: "Digital Days: youth wellbeing in everyday digital life"
  timezone: "Australia/Melbourne"
  day_boundary_hour: 4        # a "study day" runs 04:00-03:59, so 1 a.m. use belongs to the evening before

sample:
  enrol_target: 400
  retain_target: 300
  age_range: [18, 25]
  quotas: [gender, residence, ses]   # quota variables collected at screening
  recruitment_waves: 4               # staggered, months 13-18

bursts:
  n: 4
  length_days: 14
  spacing_months: 6
  follow_up_months_after_last: 6     # final full-scale survey (~month 43)

ema:
  # Delivery platform is deliberately abstract: the item bank compiles to
  # AWARE-Light ESM JSON (Android) and to a platform-neutral CSV for a
  # cross-platform EMA app. Use ONE delivery app for all participants if
  # possible, so OS is not confounded with delivery mode.
  checkins:
    per_day: 3
    window: ["09:00", "21:00"]
    min_gap_minutes: 120
    expiry_minutes: 45
    target_duration_minutes: 1
  evening:
    per_day: 1
    time: "20:00"                    # AWARE schedules on whole hours; design and app now agree
    expiry_minutes: 120
    target_duration_minutes: 3
  expected_compliance: 0.60          # 2025 CatholicCare study

passive:
  android:
    tool: "AWARE-Light"
    version_pinned: "4.2.1"          # stable at time of writing; keep fixed for the whole study
    streams: [applications_foreground, screen, notifications_meta, battery, timezone, esms]
  ios:
    tool: "weekly Screen Time upload"
    cadence_days: 7
    fields: [daily_total_minutes, pickups, notifications, top_apps]
  wearable:
    device: "Fitbit"
    api: "Google Health API v4 (health.googleapis.com)"
    api_notes: >-
      Legacy Fitbit Web API support ended 30 Sep 2026 and its endpoints are switched off on
      2 Nov 2026 (developers.google.com/health). v4 data types used: sleep (list),
      steps (dailyRollUp), heart-rate (60 s rollUp -> wear minutes). Heart rate is stored at
      1 s and steps at 1 min resolution, so minute-level wear time is available.
    oauth_scopes: [googlehealth.sleep.readonly, googlehealth.activity_and_fitness.readonly,
                   googlehealth.health_metrics_and_measurements.readonly]
    pull_cadence: "daily during a burst (catch sync gaps early); final pull at burst day 15"
    devices_total: 120
    devices_active: 100
    devices_spare: 20
    shipping_buffer_days: 5          # post / charge / reset between participants
    min_wear_hours_valid_day: 10

donation:
  routes:
    primary: "Australian Internet Observatory (AIO) data donation (DDPs) - project configured, pending ethics"
    direct: "Digital Days donation portal (docs/donate.html): runs in the participant's browser, nothing leaves the device until they press Donate"
  timing: "request exports on burst day 12; donate at burst end (day 14)"
  sources: [tiktok, youtube, instagram, chatgpt, claude]
  keep_text_from: "participant only"   # AI replies kept only as metadata (length, timestamp)

power:
  reference: "DSEM Monte Carlo simulation (separate repository)"
  claims:
    daily_effect_min: 0.05
    burst_to_burst_min: 0.20
    power: 0.80
